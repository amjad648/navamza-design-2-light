<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="blueCobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>

  <!-- Clean Minimalist Isometric Diamond 'N' Symbol -->
  <g transform="translate(25, 20)">
    <!-- Outer Shield / Diamond Path -->
    <path d="M 40 4 L 76 24 L 76 56 L 40 76 L 4 56 L 4 24 Z" fill="none" stroke="url(#blueCobalt)" stroke-width="4.5" stroke-linejoin="round" />
    
    <!-- Inner Bold 'N' Fold -->
    <path d="M 22 52 L 22 28 L 58 52 L 58 28" fill="none" stroke="#2563EB" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Accent Vertex -->
    <circle cx="40" cy="40" r="3.5" fill="#60A5FA" />
  </g>

  <!-- Wordmark -->
  <!-- Modern lowercase / mixed-case tech aesthetic -->
  <text x="140" y="68" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="700" letter-spacing="-1" fill="#0F172A">
    navamza<tspan fill="#3B82F6">.</tspan>
  </text>
  <text x="142" y="88" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="3" fill="#64748B">
    SOFTWARE &amp; CLOUD
  </text>
</svg>
