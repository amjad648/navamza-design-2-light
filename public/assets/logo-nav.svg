<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="100%" height="100%">
  <defs>
    <linearGradient id="navSquircleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="navNeon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="navNeon2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="navGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Icon (48x48) -->
  <g transform="translate(6, 6)">
    <rect width="48" height="48" rx="14" fill="url(#navSquircleBg)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2" />
    <!-- Center 'N' Glyph -->
    <g transform="translate(10, 8) scale(0.18)" filter="url(#navGlow)">
      <!-- Left Stem -->
      <path d="M 12 185 L 12 40 C 12 28 22 20 34 26 L 46 32 C 54 36 60 44 60 54 L 60 185 C 60 197 46 204 36 198 L 22 192 C 16 188 12 182 12 176 Z" fill="url(#navNeon1)" />
      <!-- Diagonal Slash -->
      <path d="M 48 38 L 138 168 C 146 180 162 180 168 168 L 174 158 C 180 148 178 136 170 126 L 86 16 C 80 8 68 8 62 16 Z" fill="url(#navNeon2)" opacity="0.95" />
      <!-- Right Stem -->
      <path d="M 128 185 L 128 40 C 128 28 138 20 150 26 L 162 32 C 170 36 176 44 176 54 L 176 185 C 176 197 162 204 152 198 L 138 192 C 132 188 128 182 128 176 Z" fill="url(#navNeon1)" />
      <circle cx="174" cy="30" r="10" fill="#38BDF8" />
    </g>
  </g>

  <!-- Brand Typography -->
  <text x="68" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="1" fill="#FFFFFF">
    Navamza
  </text>
  <circle cx="188" cy="34" r="3" fill="#38BDF8" />
</svg>
