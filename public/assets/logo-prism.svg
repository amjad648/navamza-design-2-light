  <path d="M 44 26 L 86 86 C 88 89 92 90 95 88 L 108 79 C 111 77 111 72 108 70 L 64 16 C 62 13 58 12 55 14 L 42 22 C 40 23 42 27 44 26 Z" fill="url(#prism2)" opacity="0.95" />

  <!-- Right Stem of N -->
  <path d="M 88 26 L 88 94 C 88 98 92 101 96 99 L 110 91 C 112 90 114 87 114 84 L 114 26 C 114 22 108 19 104 21 L 91 30 C 89 31 88 34 88 36 Z" fill="url(#prism3)" />

  <!-- Glowing Accent Node -->
  <circle cx="86" cy="22" r="5" fill="#38BDF8" filter="url(#glow)" />

  <!-- Brand Typography -->
  <text x="145" y="74" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" fill="#0F172A">
